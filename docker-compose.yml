services:
  redis:
    build: .
    image: redis-from-scratch:latest
    command: ["-port", "6379", "-aof", "/data/appendonly.aof", "-appendfsync", "${APPENDFSYNC:-everysec}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    stop_grace_period: 10s

  cli:
    image: redis:7
    profiles: ["tools"]
    depends_on:
      - redis
    entrypoint: ["redis-cli", "-h", "redis"]

  benchmark:
    image: redis:7
    profiles: ["tools"]
    depends_on:
      - redis
    entrypoint: ["redis-benchmark", "-h", "redis"]
    command: ["-t", "set,get", "-n", "100000", "-c", "50", "-q"]

volumes:
  redis-data:
