name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (Linux, race detector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test with race detector
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          {
            echo "### Test coverage"
            echo '```'
            go tool cover -func=coverage.out | tail -n 1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 ./...

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/resp
            target: FuzzReadCommand
          - package: ./internal/resp
            target: FuzzBulkStringRoundTrip
          - package: ./internal/glob
            target: FuzzMatch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Fuzz for 20 seconds
        run: go test ${{ matrix.package }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 20s

  docker-smoke-test:
    name: Docker smoke test with real redis-cli
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Start server with docker compose
        run: docker compose up -d --build redis

      - name: Write data, restart, and verify it survived
        run: |
          set -euo pipefail

          cli() {
            docker compose run --rm -T cli "$@"
          }

          expect() {
            local expected="$1"
            shift
            local actual
            actual="$(cli "$@")"
            if [ "$actual" != "$expected" ]; then
              echo "FAIL: '$*' returned '$actual', expected '$expected'"
              exit 1
            fi
            echo "ok: $* -> $actual"
          }

          wait_for_server() {
            for _ in $(seq 1 30); do
              if [ "$(cli PING 2>/dev/null)" = "PONG" ]; then
                return 0
              fi
              sleep 1
            done
            echo "server did not answer PING in time"
            exit 1
          }

          wait_for_server
          expect "OK" SET name redis
          expect "OK" SET session abc EX 3600
          expect "OK" SET otp 123 PX 1
          expect "1" INCR visits
          expect "2" INCR visits
          expect "1" DEL session
          expect "1" EXISTS name

          docker compose restart redis
          wait_for_server

          expect "redis" GET name
          expect "2" GET visits
          expect "" GET session
          expect "" GET otp
          expect "3" INCR visits

      - name: Benchmark SET and GET
        run: docker compose run --rm -T benchmark -t set,get -n 50000 -c 50 -q | tr '\r' '\n' | grep "per second"

      - name: Show server logs
        if: always()
        run: docker compose logs redis

      - name: Clean up
        if: always()
        run: docker compose --profile tools down -v
